<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#e4e9ef">
  <title>Alterar senha · Planejamento de Natal</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='auth.css', v='plain-theme-snow-1') }}">
  <script src="{{ url_for('static', filename='theme.js', v='christmas-theme-1') }}"></script>
</head>
<body>
  <main class="auth-card">
    <button class="theme-toggle auth-theme-toggle" id="theme-toggle" type="button" aria-label="Ativar modo escuro"></button>
    <div class="auth-icon" aria-hidden="true">🔐</div>
    <p class="eyebrow">Segurança da conta</p>
    <h1>Alterar sua senha</h1>
    <p class="intro">Confirme a senha atual e escolha uma nova com pelo menos 12 caracteres.</p>
    {% for category, message in get_flashed_messages(with_categories=true) %}
      <div class="notice notice--{{ category }}" role="status">{{ message }}</div>
    {% endfor %}
    {% if error %}<div class="notice notice--error" role="alert">{{ error }}</div>{% endif %}
    <form method="post" action="{{ url_for('change_password') }}" class="auth-form">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <label for="current-password">Senha atual</label>
      <input id="current-password" name="current_password" type="password" autocomplete="current-password" required>
      <label for="new-password">Nova senha</label>
      <input id="new-password" name="new_password" type="password" minlength="12" autocomplete="new-password" required>
      <label for="confirm-password">Confirme a nova senha</label>
      <input id="confirm-password" name="confirm_password" type="password" minlength="12" autocomplete="new-password" required>
      <button type="submit">Salvar nova senha <span aria-hidden="true">→</span></button>
    </form>
    <p class="auth-footnote"><a href="{{ url_for('index') }}">Voltar para o painel</a></p>
  </main>
</body>
</html>
