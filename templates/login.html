<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#e4e9ef">
  <title>Entrar · Planejamento de Natal</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='auth.css', v='christmas-theme-1') }}">
  <script src="{{ url_for('static', filename='theme.js', v='christmas-theme-1') }}"></script>
</head>
<body>
  <main class="auth-card">
    <button class="theme-toggle auth-theme-toggle" id="theme-toggle" type="button" aria-label="Ativar modo escuro"></button>
    <div class="auth-icon" aria-hidden="true">🎁</div>
    <p class="eyebrow">Lousa de planejamento</p>
    <h1>Que bom ter você por aqui</h1>
    <p class="intro">Entre com sua conta para acessar o painel de decoração.</p>
    {% for category, message in get_flashed_messages(with_categories=true) %}
      <div class="notice notice--{{ category }}" role="alert">{{ message }}</div>
    {% endfor %}
    <form method="post" action="{{ url_for('login') }}" class="auth-form">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <label for="email">E-mail</label>
      <input id="email" name="email" type="email" autocomplete="username" required autofocus>
      <label for="password">Senha</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required>
      <button type="submit">Entrar <span aria-hidden="true">→</span></button>
    </form>
    <p class="auth-footnote">O acesso é restrito a contas cadastradas.</p>
  </main>
</body>
</html>
