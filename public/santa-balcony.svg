<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="night" x2="0" y2="1">
      <stop stop-color="#10253b"/>
      <stop offset=".62" stop-color="#24496a"/>
      <stop offset="1" stop-color="#52778a"/>
    </linearGradient>
    <linearGradient id="room" x2="1" y2="1">
      <stop stop-color="#543526"/>
      <stop offset=".5" stop-color="#8a5130"/>
      <stop offset="1" stop-color="#3b2928"/>
    </linearGradient>
    <linearGradient id="snow" x2="0" y2="1">
      <stop stop-color="#fffdf2"/>
      <stop offset="1" stop-color="#c7dbe5"/>
    </linearGradient>
    <linearGradient id="windowGlow" x2="0" y2="1">
      <stop stop-color="#ffe6a2"/>
      <stop offset="1" stop-color="#e99545"/>
    </linearGradient>
    <linearGradient id="wood" x2="0" y2="1">
      <stop stop-color="#b97843"/>
      <stop offset=".45" stop-color="#704329"/>
      <stop offset="1" stop-color="#3e2b27"/>
    </linearGradient>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="12"/>
    </filter>
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#101923" flood-opacity=".45"/>
    </filter>
  </defs>

  <!-- Winter night beyond Santa's warm living-room balcony. -->
  <rect width="1600" height="1000" fill="url(#night)"/>
  <circle cx="1270" cy="155" r="75" fill="#fff0bf" opacity=".17" filter="url(#glow)"/>
  <circle cx="1270" cy="155" r="48" fill="#ffe8ae"/>
  <g fill="#fff4d7" opacity=".82">
    <circle cx="150" cy="140" r="2.5"/><circle cx="250" cy="220" r="2"/><circle cx="370" cy="105" r="2"/>
    <circle cx="480" cy="195" r="2.5"/><circle cx="590" cy="125" r="1.8"/><circle cx="730" cy="175" r="2"/>
    <circle cx="900" cy="95" r="2.5"/><circle cx="1040" cy="210" r="2"/><circle cx="1420" cy="260" r="2.5"/>
    <circle cx="1510" cy="140" r="1.8"/><circle cx="1130" cy="118" r="1.8"/><circle cx="320" cy="285" r="1.6"/>
  </g>
  <path d="M0 485 Q200 415 390 475 T790 465 T1200 445 T1600 470 V1000 H0Z" fill="#d9e6e8" opacity=".16"/>
  <path d="M0 565 Q210 500 430 555 T850 535 T1270 550 T1600 510 V1000 H0Z" fill="#b9d0d8" opacity=".23"/>
  <path d="M0 625 Q200 550 420 620 T860 600 T1280 615 T1600 580 V1000 H0Z" fill="#e9f0e8" opacity=".12"/>

  <!-- Snow-covered toy workshop, warm windows and chimney smoke. -->
  <g>
    <ellipse cx="850" cy="570" rx="530" ry="125" fill="#ffb95f" opacity=".15" filter="url(#glow)"/>
    <path d="M335 485 455 386 575 470 680 350 795 458 915 360 1035 468 1140 390 1265 500V720H335Z" fill="#352e35"/>
    <path d="M320 493 455 378 575 462 681 342 795 450 916 352 1035 460 1142 382 1278 492 1257 509 1141 425 1032 500 916 395 796 494 681 385 578 494 455 412 341 510Z" fill="url(#snow)"/>
    <path d="M390 500H1215V733H390Z" fill="#654332"/>
    <path d="M420 510H1185V733H420Z" fill="#754833"/>
    <path d="M530 540h94v82h-94z M665 540h94v82h-94z M800 540h94v82h-94z M935 540h94v82h-94z M1070 540h80v82h-80z" fill="url(#windowGlow)"/>
    <path d="M530 579h94 M665 579h94 M800 579h94 M935 579h94 M1070 579h80" stroke="#89553a" stroke-width="8"/>
    <path d="M558 540v82 M693 540v82 M828 540v82 M963 540v82 M1097 540v82" stroke="#89553a" stroke-width="7"/>
    <path d="M470 634h690v99H470z" fill="#49352f"/>
    <path d="M505 652h58v81h-58z M590 652h58v81h-58z M710 652h69v81h-69z M810 652h69v81h-69z M910 652h69v81h-69z M1010 652h58v81h-58z M1095 652h40v81h-40z" fill="url(#windowGlow)" opacity=".92"/>
    <path d="M605 485v-104h56v112 M1085 465V338h49v146" fill="#5e3d32"/>
    <path d="M595 385h77l-10 18h-58z M1074 339h72l-11 20h-53z" fill="url(#snow)"/>
    <g fill="#dae9eb" opacity=".4">
      <circle cx="1102" cy="296" r="17"/><circle cx="1124" cy="264" r="23"/><circle cx="1092" cy="235" r="14"/>
    </g>
    <path d="M366 734H1242" stroke="#eaf0df" stroke-width="20" stroke-linecap="round" opacity=".8"/>
    <path d="M320 752Q790 705 1280 750" fill="none" stroke="#a9c6d0" stroke-width="22" opacity=".6"/>
  </g>

  <!-- A pinned work list by the balcony door. -->
  <g transform="rotate(2 1374 525)" filter="url(#softShadow)">
    <path d="M1300 393h173v282h-173z" fill="#6c452d"/>
    <path d="M1310 405h153v256h-153z" fill="#fff4d8"/>
    <path d="M1354 392h65v22h-65z" rx="5" fill="#bd3a47"/>
    <text x="1386" y="444" text-anchor="middle" fill="#8c3d35" font-family="Georgia,serif" font-size="19" font-weight="700">LISTA DE HOJE</text>
    <path d="M1328 458h117" stroke="#d7bd91"/>
    <g font-family="Arial,sans-serif" font-size="13" fill="#514331">
      <rect x="1328" y="476" width="13" height="13" rx="2" fill="none" stroke="#39845c" stroke-width="2"/><path d="m1331 482 4 4 7-9" fill="none" stroke="#39845c" stroke-width="2"/><text x="1350" y="487">Separar presentes</text>
      <rect x="1328" y="510" width="13" height="13" rx="2" fill="none" stroke="#39845c" stroke-width="2"/><path d="m1331 516 4 4 7-9" fill="none" stroke="#39845c" stroke-width="2"/><text x="1350" y="521">Revisar os brinquedos</text>
      <rect x="1328" y="544" width="13" height="13" rx="2" fill="none" stroke="#8b7652" stroke-width="2"/><text x="1350" y="555">Carregar o trenó</text>
      <rect x="1328" y="578" width="13" height="13" rx="2" fill="none" stroke="#8b7652" stroke-width="2"/><text x="1350" y="589">Conferir a lista</text>
    </g>
    <path d="M1353 627q27 17 57 0" fill="none" stroke="#bd3a47" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- The open balcony frame, curtains and warm wood foreground. -->
  <path d="M0 0H1600V82H0Z" fill="url(#room)"/>
  <path d="M0 0h93v1000H0z M1507 0h93v1000h-93z" fill="url(#room)"/>
  <path d="M94 0h20v884H94z M1486 0h20v884h-20z" fill="#d29a5c" opacity=".75"/>
  <path d="M0 76H1600" stroke="#d9a66a" stroke-width="8" opacity=".65"/>
  <path d="M0 880H1600V1000H0Z" fill="url(#wood)"/>
  <path d="M0 884Q390 840 800 874T1600 866" fill="none" stroke="#e1ae70" stroke-width="13"/>
  <path d="M0 930Q380 887 800 920T1600 908" fill="none" stroke="#2f2526" stroke-width="16" opacity=".7"/>
  <path d="M74 84h34v791H74z M1492 84h34v791h-34z" fill="#bd8050" opacity=".76"/>
  <g fill="#ffd992" opacity=".8">
    <circle cx="42" cy="110" r="6"/><circle cx="42" cy="180" r="6"/><circle cx="42" cy="250" r="6"/><circle cx="42" cy="320" r="6"/>
    <circle cx="1558" cy="110" r="6"/><circle cx="1558" cy="180" r="6"/><circle cx="1558" cy="250" r="6"/><circle cx="1558" cy="320" r="6"/>
  </g>
  <path d="M0 0H1600V1000H0Z" fill="none" stroke="#241c1d" stroke-width="20" opacity=".4"/>
</svg>
